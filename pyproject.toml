[project]
name = "spain-energy-risk-index"
version = "0.2.0"
description = "Spain Energy Grid Risk Index — daily risk forecasting with LightGBM"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pyarrow>=17",
    "tenacity>=9",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "python-dateutil>=2.9",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "holidays>=0.60",
    "openmeteo-requests>=1.2",
    "mlflow>=2.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "plotly>=5.22",
    "matplotlib>=3.9",
    "shap>=0.45",
    "nbformat>=5.9",
    "kaleido>=0.2",
]
dev = [
    "pytest>=7.0",
    "flake8>=7.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
]
